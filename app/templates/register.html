<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Registration - PSNA Lab Attendance</title>
<link rel="stylesheet" href="/static/design-system.css" />
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    height: auto;
    background: #E2E8F0;
    padding: 1.5rem 0;
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    padding: 2.5rem;
    border-radius: 8px;
    background: var(--white);
    box-shadow: var(--box-shadow);
    text-align: center;
  }
  .auth-card h2 { margin: 0 0 0.4rem; }
  .auth-card .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .auth-card form { display: flex; flex-direction: column; gap: 0.9rem; text-align: left; }
  .auth-card .helper { margin-top: 1.25rem; font-size: 0.8rem; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="auth-card">
    <h2>Hackathon Participant Registration</h2>
    <p class="subtitle">Enter your team and ID details now. Face capture happens at the event desk.</p>
    {% if error %}<div class="flash-message error">{{ error }}</div>{% endif %}
    {% if success %}<div class="flash-message success">{{ success }}</div>{% endif %}
    <form method="post" action="/register" id="register-form">
      <label>Participant ID / Roll No *
        <input type="text" name="roll_no" id="roll_no-input" class="form-control" required placeholder="e.g. 23it112 or P101" />
        <div id="roll-no-warning" class="status err" style="display:none;">Already registered — see the event coordinator if this is a mistake.</div>
      </label>
      <label>Full Name *
        <input type="text" name="name" class="form-control" required placeholder="Enter your full name" />
      </label>
      <label>Team Name *
        <select name="team_name" id="team-select" class="form-control" required style="font-weight:600; color:#0F172A;" onchange="handleTeamChange(this)">
          <option value="">-- Select Team --</option>
          <optgroup label="Official Hackathon Teams (30)">
            {% for t in hackathon_teams %}
            <option value="{{ t }}">{{ loop.index }}. {{ t }}</option>
            {% endfor %}
          </optgroup>
          {% if extra_teams %}
          <optgroup label="Additional Registered Teams">
            {% for t in extra_teams %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
          </optgroup>
          {% endif %}
          <option value="__OTHER__" style="font-weight:700; color:#2563EB;">➕ + Add New / Other Team...</option>
        </select>
        <div id="custom-team-wrap" style="display:none; margin-top:0.5rem;">
          <input type="text" id="custom-team-input" name="custom_team_name" class="form-control" placeholder="Enter new team name (e.g. CyberKnights)" style="font-weight:600; border: 2px solid #3B82F6;" />
          <small style="color:var(--text-muted); font-size:0.75rem;">Type the new team name to register your team.</small>
        </div>
        <small style="color:var(--text-muted); font-size:0.75rem;">Max 4 members per team &bull; 30 Official Teams + Extra Teams Supported</small>
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Save Details</button>
    </form>
    <div class="helper">Made a typo? See the lab in-charge to have it corrected — the form only accepts each ID once.</div>
  </div>
  <script>
    function handleTeamChange(selectEl) {
      const wrap = document.getElementById('custom-team-wrap');
      const input = document.getElementById('custom-team-input');
      if (!wrap || !input) return;
      if (selectEl.value === '__OTHER__') {
        wrap.style.display = 'block';
        input.required = true;
        input.focus();
      } else {
        wrap.style.display = 'none';
        input.required = false;
      }
    }

    const regForm = document.getElementById('register-form');
    if (regForm) {
      regForm.addEventListener('submit', (e) => {
        const select = document.getElementById('team-select');
        const customInput = document.getElementById('custom-team-input');
        if (select && select.value === '__OTHER__') {
          if (!customInput || !customInput.value.trim()) {
            e.preventDefault();
            alert('Please enter a team name for the new team.');
            if (customInput) customInput.focus();
            return false;
          }
        }
      });
    }

    const rollNoInput = document.getElementById('roll_no-input');
    const rollNoWarning = document.getElementById('roll-no-warning');
    const submitBtn = document.getElementById('submit-btn');

    async function checkRollNo() {
      const value = rollNoInput.value.trim();
      rollNoWarning.style.display = 'none';
      submitBtn.disabled = false;
      if (!value) { return; }
      try {
        const res = await fetch(`/register/check?roll_no=${encodeURIComponent(value)}`);
        const data = await res.json();
        if (data.exists) {
          rollNoWarning.style.display = 'block';
          submitBtn.disabled = true;
        }
      } catch (e) { /* non-fatal, server re-checks on submit */ }
    }
    rollNoInput.addEventListener('blur', checkRollNo);
    rollNoInput.addEventListener('input', () => {
      rollNoWarning.style.display = 'none';
      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
